<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hala Walla Executive Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9fafb; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    .toggle-checkbox:checked { right: 0; border-color: #68D391; }
    .toggle-checkbox:checked + .toggle-label { background-color: #68D391; }
    .toggle-checkbox { right: 0; z-index: 1; border-color: #e2e8f0; transition: all 0.3s; }
    .toggle-label { width: 3rem; height: 1.5rem; background-color: #e2e8f0; border-radius: 9999px; transition: all 0.3s; cursor: pointer; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Icons ---
    const IconClipboardList = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>;
    const IconCreditCard = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>;
    const IconBarChart2 = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>;
    const IconPin = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" x2="12" y1="17" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.68V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3v4.68a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>;
    const IconChevronDown = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>;
    const IconElephant = () => <svg viewBox="0 0 64 64" width="28" height="28" fill="currentColor"><path d="M58,34.4c-0.8-1.4-2.1-2.4-3.6-3c-1.5-0.6-3.1-0.6-4.6,0c-0.8,0.3-1.4,0.8-2,1.4c-1-1.2-2.5-1.9-4.2-1.9c-2,0-3.8,1-4.8,2.5 c-1-1.1-2.4-1.8-4-1.8c-2,0-3.8,1.1-4.7,2.8c-1.1-1.6-2.9-2.7-5-2.7c-2.3,0-4.3,1.3-5.3,3.3C18.6,35,17,35,16,35c-1.1,0-2,0.9-2,2 s0.9,2,2,2c2.1,0,4-1.3,4.9-3.2c0.3-0.7,1-1.1,1.8-1.1c1.2,0,2.2,1,2.2,2.2c0,3.3,2.7,6,6,6c0.5,0,1,0,1.5-0.1 c1.1,2.1,3.4,3.5,6,3.5c1.6,0,3.1-0.6,4.2-1.6c1.1,1,2.6,1.6,4.2,1.6c2.6,0,4.8-1.4,6-3.5c0.5,0.1,1,0.1,1.5,0.1c3.3,0,6-2.7,6-6 C60,37.3,59.2,35.7,58,34.4z M49.8,35.4c0.5-0.2,1.1-0.2,1.6,0c0.6,0.2,1,0.7,1.2,1.3c0.1,0.3,0.1,0.6,0,0.9c-0.1,0.3-0.3,0.5-0.5,0.7 c-0.2,0.2-0.5,0.3-0.8,0.4c-0.3,0.1-0.6,0.1-0.9,0c-0.6-0.2-1-0.7-1.2-1.3C49.1,36.5,49.3,35.8,49.8,35.4z"/><path d="M12,28c0-8.8,7.2-16,16-16s16,7.2,16,16v2h4v-2c0-11-9-20-20-20S8,17,8,28v2h4V28z"/></svg>;
    const IconTent = () => <svg viewBox="0 0 64 64" width="28" height="28" fill="currentColor"><path d="M32,4L4,24v36h56V24L32,4z M32,10.3l20,14.3v4.1L32,14.4L12,28.7v-4.1L32,10.3z M12,34.4l20-14.3l20,14.3v21.6H12V34.4z"/><rect x="28" y="42" width="8" height="14"/></svg>;
    const IconBus = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>;
    const IconBuilding = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></svg>;
    const IconChevronLeft = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>;
    const IconAccounting = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M14 8H8"/><path d="M16 12H8"/><path d="M13 16H8"/></svg>;
    const IconChevronRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>;
    const IconCheckCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>;
    const IconAlertCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>;

    // ใส่ลิงก์ Web App ตรงนี้ครับ
    const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbyVSGSC5sNwOfxwQvTwi0kpBtUsGn6-4SnsBFqqHNBqjGRoVYR0EFXGOMuuAHVUakTE/exec";

    // Component สำหรับสวิตช์ เปิด-ปิด
    const StatusToggle = ({ isPaid, onChange }) => (
      <div className="flex items-center space-x-3">
        <span className={`text-sm font-bold ${isPaid ? 'text-gray-400' : 'text-red-500'}`}>Unpaid</span>
        <div className="relative inline-block w-12 h-6 align-middle select-none transition duration-200 ease-in">
          <input type="checkbox" checked={isPaid} onChange={(e) => onChange(e.target.checked)} className="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
          <label className="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
        </div>
        <span className={`text-sm font-bold ${isPaid ? 'text-green-500' : 'text-gray-400'}`}>Paid</span>
      </div>
    );

    // ฟังก์ชันแปลงวันที่ให้สวยงาม (2026-04-03 -> 03/04/2026)
    const formatDateShow = (dStr) => {
      if (!dStr) return '';
      if (dStr.length === 7) return dStr; 
      const parts = dStr.split('-');
      if(parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
      return dStr;
    };

    function App() {
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [activeTab, setActiveTab] = useState('overview');
      const [errorMsg, setErrorMsg] = useState("");
      const [opsDate, setOpsDate] = useState(new Date());
      const [expandedPaymentId, setExpandedPaymentId] = useState(null);
      const [editForm, setEditForm] = useState({});
      
      const [isOtherMenuOpen, setIsOtherMenuOpen] = useState(false);
      const [selectedYear, setSelectedYear] = useState(null);
      const [isEditingManual, setIsEditingManual] = useState(false);
      const [manualEditForm, setManualEditForm] = useState({});
      const [accountingData, setAccountingData] = useState(() => {
        try { return JSON.parse(localStorage.getItem('hala_accounting') || '{}'); }
        catch(e) { return {}; }
      });
      const [isEditingAccounting, setIsEditingAccounting] = useState(false);
      const [accountingEditForm, setAccountingEditForm] = useState({});
      const [isEditingComparison, setIsEditingComparison] = useState(false);
      const [comparisonEditForm, setComparisonEditForm] = useState({});
      
      const [dashboardData, setDashboardData] = useState({
        currentMonthText: "กำลังโหลดข้อมูล...",
        currentMonthValue: "",
        overview: { tourOnly: 0, hotelOnly: 0 },
        themeParks: { fantasea: { initialQuota: 183, used: 0 }, carnivalMagic: { initialQuota: 1200, used: 0 } },
        yearlyReport: [],
        manualYearlyData: {},
        dailyOps: { tours: [], hotels: [] },
        paymentList: [] 
      });

      useEffect(() => {
        fetchData();
      }, []);

      const fetchData = async () => {
        try {
          const response = await fetch(GOOGLE_API_URL);
          const data = await response.json();
          
          if(data.paymentList) {
             data.paymentList.sort((a, b) => {
                const aAllPaid = a.suppStatus === 'Paid' && a.custStatus === 'Paid';
                const bAllPaid = b.suppStatus === 'Paid' && b.custStatus === 'Paid';
                
                if (aAllPaid && !bAllPaid) return 1;
                if (!aAllPaid && bAllPaid) return -1;
                if (aAllPaid && bAllPaid) return 0;
                
                const getUrgency = (item) => {
                    let urgency = new Date('2099-12-31').getTime();
                    let hasDue = false;
                    
                    if (item.suppStatus !== 'Paid' && item.suppDueDate) {
                        urgency = Math.min(urgency, new Date(item.suppDueDate).getTime());
                        hasDue = true;
                    }
                    if (item.custStatus !== 'Paid' && item.custDueDate) {
                        urgency = Math.min(urgency, new Date(item.custDueDate).getTime());
                        hasDue = true;
                    }
                    
                    if (!hasDue && item.serviceDate) {
                        const sDate = new Date(item.serviceDate).getTime();
                        if (!isNaN(sDate)) urgency = Math.min(urgency, sDate);
                    }
                    return urgency;
                };
                
                return getUrgency(a) - getUrgency(b);
             });
          }
          
          setDashboardData(data);
          setLoading(false);
        } catch (err) {
          setErrorMsg("เชื่อมต่อข้อมูลไม่สำเร็จ กรุณาลองรีเฟรชหน้าเว็บอีกครั้ง");
          setLoading(false);
        }
      };

      const handleEditPayment = (payment) => {
        if (expandedPaymentId === payment.uid) {
          setExpandedPaymentId(null);
        } else {
          setExpandedPaymentId(payment.uid);
          setEditForm({
            suppStatus: payment.suppStatus === 'Paid',
            suppDueDate: payment.suppDueDate || '',
            suppPaidDate: payment.suppPaidDate || '',
            suppEmail: payment.suppEmail || false,
            custStatus: payment.custStatus === 'Paid',
            custDueDate: payment.custDueDate || '',
            custPaidDate: payment.custPaidDate || '',
            custEmail: payment.custEmail || false,
            isCleared: payment.isCleared || false
          });
        }
      };

      const handleSavePayment = async (uid, voucherRaw, isClearedFlag = false) => {
        setSaving(true);
        const payload = {
          action: 'savePayment',
          uid: uid,             
          voucherRaw: voucherRaw,
          data: {
            suppStatus: editForm.suppStatus ? 'Paid' : 'Unpaid',
            suppDueDate: editForm.suppStatus ? '' : editForm.suppDueDate,
            suppPaidDate: editForm.suppStatus ? editForm.suppPaidDate : '',
            suppEmail: editForm.suppEmail,
            custStatus: editForm.custStatus ? 'Paid' : 'Unpaid',
            custDueDate: editForm.custStatus ? '' : editForm.custDueDate,
            custPaidDate: editForm.custStatus ? editForm.custPaidDate : '',
            custEmail: editForm.custEmail,
            isCleared: isClearedFlag 
          }
        };

        try {
          const res = await fetch(GOOGLE_API_URL, { method: 'POST', body: JSON.stringify(payload) });
          const result = await res.json();
          if(result.status === 'success') {
             await fetchData();
             setExpandedPaymentId(null);
          }
        } catch (err) {
          alert("บันทึกไม่สำเร็จ: " + err.message);
        } finally {
          setSaving(false);
        }
      };

      const formatCurrency = (amount) => new Intl.NumberFormat('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount || 0) + " ฿";
      const formatNumber = (num) => new Intl.NumberFormat('th-TH').format(num || 0);

      const getMonthName = (ym) => {
        if (!ym || !ym.includes("-")) return ym;
        const [y, m] = ym.split("-");
        const monthNames = ["", "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        return `${monthNames[parseInt(m, 10)]} ${parseInt(y) + 543}`;
      };

      const changeOpsDate = (days) => {
        const newDate = new Date(opsDate);
        newDate.setDate(newDate.getDate() + days);
        setOpsDate(newDate);
      };

      if (loading) {
        return (
          <div className="min-h-screen bg-gray-50 flex flex-col items-center justify-center">
            <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <div className="text-xl font-semibold text-gray-500">กำลังดึงข้อมูลล่าสุดจาก Google Sheets...</div>
          </div>
        );
      }

      if (errorMsg) return (<div className="min-h-screen bg-gray-50 flex flex-col items-center justify-center text-red-500 p-8 text-center"><h2 className="text-2xl font-bold mb-4">พบข้อผิดพลาด</h2><p>{errorMsg}</p></div>);

      const currentYear = (dashboardData?.currentMonthValue || new Date().getFullYear().toString()).split('-')[0];
      const availableYears = [...new Set((dashboardData?.yearlyReport || []).map(r => r.month.split('-')[0]))].sort();
      const manualData = dashboardData?.manualYearlyData || {};
      const manualYears = [...new Set(Object.keys(manualData).map(k => k.split('-')[0]))];
      const activeYear = selectedYear || currentYear;
      const thisYearReport = (dashboardData?.yearlyReport || []).filter(r => r.month.startsWith(activeYear));

      // Yearly Report: always use currentYear for top section
      const currentYearApiReport = (dashboardData?.yearlyReport || []).filter(r => r.month.startsWith(currentYear));
      const COMPARISON_YEARS = Array.from({length: 6}, (_, i) => String(parseInt(currentYear) - i));

      const allKnownYearsNums = [...availableYears, ...manualYears, currentYear].map(Number);
      const minNavYear = Math.min(...allKnownYearsNums) - 1;
      const maxNavYear = parseInt(currentYear);
      const canGoPrevYear = parseInt(activeYear) > minNavYear;
      const canGoNextYear = parseInt(activeYear) < maxNavYear;

      const MONTH_KEYS = Array.from({length: 12}, (_, i) => `${activeYear}-${String(i+1).padStart(2,'0')}`);
      const apiDataMap = Object.fromEntries(thisYearReport.map(r => [r.month, r]));
      const mergedYearReport = MONTH_KEYS.map(month => {
        if (apiDataMap[month]) return { ...apiDataMap[month], totalOnly: null, source: 'api' };
        if (manualData[month]) {
          const md = manualData[month];
          const tour = Number(md.tourProfit) || 0;
          const hotel = Number(md.hotelProfit) || 0;
          const totalOnly = (md.totalOnly != null && md.totalOnly !== '') ? Number(md.totalOnly) : null;
          const total = totalOnly !== null ? totalOnly : tour + hotel;
          return { month, tourProfit: tour, hotelProfit: hotel, totalOnly, totalProfit: total, source: 'manual' };
        }
        return { month, tourProfit: 0, hotelProfit: 0, totalOnly: null, totalProfit: 0, source: 'empty' };
      });
      const allDataReport = mergedYearReport.filter(r => r.source !== 'empty');
      const displayYearReport = isEditingManual ? mergedYearReport : allDataReport;

      let displayTourProfit = 0;
      let displayHotelProfit = 0;

      if (activeTab === 'overview') {
        displayTourProfit = dashboardData?.overview?.tourOnly || 0;
        displayHotelProfit = dashboardData?.overview?.hotelOnly || 0;
      } else if (activeTab === 'yearlyReport') {
        displayTourProfit = currentYearApiReport.reduce((sum, r) => sum + (r.tourProfit || 0), 0);
        displayHotelProfit = currentYearApiReport.reduce((sum, r) => sum + (r.hotelProfit || 0), 0);
      }

      const displayTotalProfit = activeTab === 'yearlyReport'
        ? currentYearApiReport.reduce((sum, r) => sum + (r.totalProfit || 0), 0)
        : displayTourProfit + displayHotelProfit;
      const fantaseaRemaining = (dashboardData?.themeParks?.fantasea?.initialQuota || 0) - (dashboardData?.themeParks?.fantasea?.used || 0);
      const carnivalRemaining = (dashboardData?.themeParks?.carnivalMagic?.initialQuota || 0) - (dashboardData?.themeParks?.carnivalMagic?.used || 0);

      const y = opsDate.getFullYear();
      const m = String(opsDate.getMonth() + 1).padStart(2, '0');
      const d = String(opsDate.getDate()).padStart(2, '0');
      const targetDateYMD = `${y}-${m}-${d}`;

      const rawTours = dashboardData?.dailyOps?.tours || [];
      const rawHotels = dashboardData?.dailyOps?.hotels || [];
      const filteredTours = rawTours.filter(t => t.dateStr === targetDateYMD);
      const filteredHotels = rawHotels.filter(h => h.dateStr === targetDateYMD);
      
      const paymentList = (dashboardData?.paymentList || []).filter(p => p.isCleared !== true);

      // --- Accounting Tab computed values ---
      const accMonthData = MONTH_KEYS.map(month => {
        const rev = allDataReport.find(r => r.month === month);
        const totalRevenue = rev ? rev.totalProfit : 0;
        const src = isEditingAccounting && accountingEditForm[month] ? accountingEditForm[month] : (accountingData[month] || {});
        const salary = parseFloat(src?.salary) || 0;
        const socialSec = parseFloat(src?.socialSec) || 0;
        const others = parseFloat(src?.others) || 0;
        const othersDesc = src?.othersDesc || '';
        const vat = parseFloat(src?.vat) || 0;
        const totalExpense = salary + socialSec + others + vat;
        const afterExpense = totalRevenue - totalExpense;
        const commission = afterExpense > 0 ? afterExpense * 0.05 : 0;
        const netCompany = afterExpense - commission;
        return { month, totalRevenue, salary, socialSec, others, othersDesc, vat, totalExpense, afterExpense, commission, netCompany };
      });
      const displayAccData = isEditingAccounting ? accMonthData : accMonthData.filter(r => r.totalRevenue > 0 || r.totalExpense > 0);
      const accTotals = accMonthData.reduce((t, r) => ({
        revenue: t.revenue + r.totalRevenue,
        expense: t.expense + r.totalExpense,
        salary: t.salary + r.salary,
        socialSec: t.socialSec + r.socialSec,
        others: t.others + r.others,
        vat: t.vat + r.vat,
        afterExpense: t.afterExpense + r.afterExpense,
        commission: t.commission + r.commission,
        netCompany: t.netCompany + r.netCompany
      }), { revenue: 0, expense: 0, salary: 0, socialSec: 0, others: 0, vat: 0, afterExpense: 0, commission: 0, netCompany: 0 });

      const startAccountingEdit = () => {
        const form = {};
        MONTH_KEYS.forEach(month => {
          const acc = accountingData[month] || {};
          form[month] = { salary: acc.salary ?? '', socialSec: acc.socialSec ?? '', others: acc.others ?? '', othersDesc: acc.othersDesc || '', vat: acc.vat ?? '' };
        });
        setAccountingEditForm(form);
        setIsEditingAccounting(true);
      };
      const saveAccounting = () => {
        const updated = { ...accountingData };
        Object.keys(accountingEditForm).forEach(month => {
          const f = accountingEditForm[month];
          const salary = parseFloat(f.salary) || 0;
          const socialSec = parseFloat(f.socialSec) || 0;
          const others = parseFloat(f.others) || 0;
          const othersDesc = (f.othersDesc || '').trim();
          const vat = parseFloat(f.vat) || 0;
          if (salary === 0 && socialSec === 0 && others === 0 && vat === 0 && !othersDesc) {
            delete updated[month];
          } else {
            updated[month] = { salary, socialSec, others, othersDesc, vat };
          }

                                    )}
                                    {payment.type === 'Hotel' && payment.stayDate && (
                                      <><span className="mx-1.5 text-gray-400">-</span> <span className="font-semibold text-gray-800">{payment.stayDate}</span></>
                                    )}
                                  </p>
                                </div>
                              </div>
                              
                              {/* สรุปสถานะย่อๆ */}
                              <div className="flex items-center space-x-4 text-sm font-bold mr-4">
                                <div className="flex flex-col items-end w-36">
                                  <span className="text-gray-400 mb-1 text-xs">ซัพพลายเออร์</span>
                                  {payment.suppStatus === 'Paid' ? 
                                    <span className="flex items-center text-green-500"><IconCheckCircle /> <span className="ml-1">Paid {payment.suppPaidDate && `(${formatDateShow(payment.suppPaidDate)})`}</span></span> : 
                                    <span className="flex items-center text-red-500"><IconAlertCircle /> <span className="ml-1">{payment.suppDueDate ? `Due: ${formatDateShow(payment.suppDueDate)}` : 'Unpaid'}</span></span>
                                  }
                                </div>
                                <div className="w-px h-10 bg-gray-200 mx-2"></div>
                                <div className="flex flex-col items-start w-36">
                                  <span className="text-gray-400 mb-1 text-xs">ลูกค้า</span>
                                  {payment.custStatus === 'Paid' ? 
                                    <span className="flex items-center text-green-500"><IconCheckCircle /> <span className="ml-1">Paid {payment.custPaidDate && `(${formatDateShow(payment.custPaidDate)})`}</span></span> : 
                                    <span className="flex items-center text-red-500"><IconAlertCircle /> <span className="ml-1">{payment.custDueDate ? `Due: ${formatDateShow(payment.custDueDate)}` : 'Unpaid'}</span></span>
                                  }
                                </div>
                              </div>
                              <div className="text-gray-400">
                                {isExpanded ? <IconChevronDown /> : <IconChevronRight />}
                              </div>
                            </div>

                            {/* ส่วนแก้ไขข้อมูล */}
                            {isExpanded && (
                              <div className="bg-gray-50 p-6 border-t border-gray-100 grid grid-cols-1 md:grid-cols-2 gap-8 animate-fade-in shadow-inner">
                                
                                {/* ซัพพลายเออร์ */}
                                <div className="bg-white p-5 rounded-lg border border-gray-200 shadow-sm relative overflow-hidden">
                                  <div className="absolute top-0 left-0 w-1 h-full bg-blue-400"></div>
                                  <h3 className="font-bold text-gray-800 border-b border-gray-100 pb-3 mb-4 flex items-center">
                                    <IconBuilding /> <span className="ml-2">การจ่ายเงินซัพพลายเออร์</span>
                                  </h3>
                                  <div className="space-y-5">
                                    <div className="flex items-center justify-between">
                                      <span className="text-sm font-medium text-gray-600">สถานะการจ่ายเงิน</span>
                                      <StatusToggle isPaid={editForm.suppStatus} onChange={(val) => setEditForm({...editForm, suppStatus: val, suppDueDate: val ? '' : editForm.suppDueDate, suppPaidDate: val ? editForm.suppPaidDate : ''})} />
                                    </div>
                                    
                                    {!editForm.suppStatus ? (
                                      <div>
                                        <label className="block text-sm font-bold text-red-600 mb-1">กำหนดชำระเงิน (Due Date)</label>
                                        <input type="date" value={editForm.suppDueDate} onChange={(e) => setEditForm({...editForm, suppDueDate: e.target.value})} className="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-300" />
                                      </div>
                                    ) : (
                                      <div className="animate-fade-in">
                                        <label className="block text-sm font-bold text-green-600 mb-1">วันที่จ่ายเงินแล้ว (Paid Date)</label>
                                        <input type="date" value={editForm.suppPaidDate} onChange={(e) => setEditForm({...editForm, suppPaidDate: e.target.value})} className="w-full border border-green-300 bg-green-50 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500" />
                                      </div>
                                    )}

                                    <div className={`flex items-center ${editForm.suppStatus ? 'opacity-40 pointer-events-none' : 'opacity-100'}`}>
                                      <input type="checkbox" id="suppEmail" checked={editForm.suppEmail} onChange={(e) => setEditForm({...editForm, suppEmail: e.target.checked})} className="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" disabled={editForm.suppStatus}/>
                                      <label htmlFor="suppEmail" className="ml-2 text-sm text-gray-600">ส่งอีเมลแจ้งเตือนแอดมินล่วงหน้า 1 วัน</label>
                                    </div>
                                  </div>
                                </div>

                                {/* ลูกค้า */}
                                <div className="bg-white p-5 rounded-lg border border-gray-200 shadow-sm relative overflow-hidden">
                                  <div className="absolute top-0 left-0 w-1 h-full bg-orange-400"></div>
                                  <h3 className="font-bold text-gray-800 border-b border-gray-100 pb-3 mb-4 flex items-center">
                                    <IconCreditCard /> <span className="ml-2">การรับเงินจากลูกค้า</span>
                                  </h3>
                                  <div className="space-y-5">
                                    <div className="flex items-center justify-between">
                                      <span className="text-sm font-medium text-gray-600">สถานะการรับเงิน</span>
                                      <StatusToggle isPaid={editForm.custStatus} onChange={(val) => setEditForm({...editForm, custStatus: val, custDueDate: val ? '' : editForm.custDueDate, custPaidDate: val ? editForm.custPaidDate : ''})} />
                                    </div>
                                    
                                    {!editForm.custStatus ? (
                                      <div>
                                        <label className="block text-sm font-bold text-red-600 mb-1">กำหนดรับเงิน (Due Date)</label>
                                        <input type="date" value={editForm.custDueDate} onChange={(e) => setEditForm({...editForm, custDueDate: e.target.value})} className="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-300" />
                                      </div>
                                    ) : (
                                      <div className="animate-fade-in">
                                        <label className="block text-sm font-bold text-green-600 mb-1">วันที่รับเงินแล้ว (Paid Date)</label>
                                        <input type="date" value={editForm.custPaidDate} onChange={(e) => setEditForm({...editForm, custPaidDate: e.target.value})} className="w-full border border-green-300 bg-green-50 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500" />
                                      </div>
                                    )}

                                    <div className={`flex items-center ${editForm.custStatus ? 'opacity-40 pointer-events-none' : 'opacity-100'}`}>
                                      <input type="checkbox" id="custEmail" checked={editForm.custEmail} onChange={(e) => setEditForm({...editForm, custEmail: e.target.checked})} className="w-4 h-4 text-orange-600 border-gray-300 rounded focus:ring-orange-500" disabled={editForm.custStatus}/>
                                      <label htmlFor="custEmail" className="ml-2 text-sm text-gray-600">ส่งอีเมลแจ้งเตือนแอดมินล่วงหน้า 1 วัน</label>
                                    </div>
                                  </div>
                                </div>
                                
                                {/* บันทึก & เคลียร์ (เพิ่มปุ่มนี้เมื่อ Paid 2 ฝั่ง) */}
                                <div className="md:col-span-2 flex justify-end mt-4 pt-4 border-t border-gray-200 space-x-3">
                                  {(editForm.suppStatus && editForm.custStatus) && (
                                    <button onClick={() => handleSavePayment(payment.uid, payment.voucherRaw, true)} disabled={saving} className={`px-6 py-2 rounded-lg font-bold text-white shadow-sm transition-all ${saving ? 'bg-gray-400 cursor-not-allowed' : 'bg-green-500 hover:bg-green-600 hover:shadow-md'}`}>
                                      {saving ? 'กำลังบันทึก...' : '✅ บันทึก & เคลียร์ออกเลย'}
                                    </button>
                                  )}
                                  <button onClick={() => handleSavePayment(payment.uid, payment.voucherRaw, false)} disabled={saving} className={`px-6 py-2 rounded-lg font-bold text-white shadow-sm transition-all ${saving ? 'bg-gray-400 cursor-not-allowed' : 'bg-gray-900 hover:bg-black hover:shadow-md'}`}>
                                    {saving ? 'กำลังบันทึก...' : 'บันทึกข้อมูล'}
                                  </button>
                                </div>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
